# Resolution presets for Tachytome
# This file is generated as `~~/script-opts/tachytome/default.res` when that dir has no `.res` files
# Every `.res` file in that dir is read in alphabetical order
# Preset names are unique per file, the last definition in a file wins with a warning
# Different files can use the same names, e.g. `default/vertical` and `mine/vertical`
# A bare name picks the first file that defines it, `file/name` picks one from a specific file
#
# Syntax:
#   <name> = <chain>
#   disabled <name> = <chain>
#
# `disabled` turns a preset off, remove it to turn the preset back on
# A disabled preset isn't listed and a bare name skips it for the next file that defines it
# `m` in the Resolution Presets list opens the Preset Manager, which enables, disables and deletes presets for you
# `n` there saves the chain you have now as a new preset, in this file, another one or a new one
# A chain is anything the `resolution` option takes, other presets included
# Names are case insensitive and can't hold spaces, `=` or `/`
# Names can't be sizes, modes or scalers, e.g. `720p`, `0.5x`, `fit` or `lanczos`
# Presets are used by name anywhere in a chain, e.g. `halfres` or `autocrop halfres`
# A mode or scaler right after a preset applies to all of its layers, e.g. `vertical fit`

# Crops black bars, the same as the `auto` token
autocrop = auto

# Half the size, e.g. 2560x1440 to 1280x720
halfres = 0.5x

# Examples, remove `disabled` from the ones you want

# Common sizes, set on the short side so vertical videos work too
# 2k follows the gaming use, 1440p, use 1080p if you mean that or 2048x1080 for DCI
disabled hd  = 720p
disabled fhd = 1080p
disabled qhd = 1440p
disabled 2k  = 1440p
disabled uhd = 2160p
disabled 4k  = 2160p
disabled 8k  = 4320p

# Vertical 9:16 for Shorts, Reels and TikTok, cuts the sides off
disabled vertical = 1080x1920 cover

# A stretched 1280x1024 game recorded at a higher res, back to its native frame
disabled cs = 1280x1024 stretch
