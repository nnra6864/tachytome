# Tachytome's defaults, put your changes in `~~/script-opts/tachytome/user.conf`
# Every option is described in the Config Editor, `c` in Settings, then Enter on a config
# The descriptions live in `lang/en.lua` and the other language files

## Output

output_dir=~/Videos/tachytome
suffix= Remuxed
space_replacement=_
container=mkv
trash_source=yes

## Video

video_encoder=av1
quality=35
preset=4
keyframe_interval=
lossless_cut=no
accurate_cut=yes

## Resolution

resolution_enabled=no
resolution=auto
resolution_mode=fit
scaler_down=lanczos
scaler_up=lanczos
pad_color=black

## Audio

audio_encoder=copy
audio_bitrate=

## Tracks

tracks=
tracks_type=audio

## Effects

effects_enabled=no
effects_presets=blur_fade

## Screenshot

screenshot_save=no
screenshot_dir=
screenshot_format=png
screenshot_subtitles=yes

## Stats

show_stats_screen=yes
show_stats_terminal=yes
stats_osd_time=8
stats_scope=trashed

## Text

font=
font_size=18
small_font_size=16
glow_size=2.5
glow_blur=0.5
glow_color=000000FF

## Colors

text_color=B8DEE6
dim_text_color=8FADB3
value_color=369DB2
on_text=🞜
on_color=47B270
off_text=🞖
off_color=B24754
warning_color=8EB247
error_color=B24754
flash_color=45CAE5

## Input Cursor

cursor_style=bar
cursor_color=B8DEE6
cursor_glow_size=1.5
cursor_glow_blur=0.5
cursor_glow_color=000000FF
cursor_text_color=

## Animations

flash_in_duration=0.1
flash_in_easing=ease_out_expo
flash_out_duration=0.5
flash_out_easing=ease_out_cubic
start_stagger=0.03
start_in_duration=0.25
start_in_easing=ease_out_sine
start_out_duration=0.75
start_out_easing=ease_out_cubic

## Menu

selected_menu=default
menu_path_separator=/
layer_preview=yes
key_hints=yes
tips=yes

## Language and Version

language=auto
version=latest

## Menus

# Rebind on top of the active menu
# menu R render
# menu add x mark_in
# menu q-c quality
# menu hide X render_queue
# menu s-s hide

# Default menu
menu default {
    g     goto
    i     mark_in
    o     mark_out
    s-i   set_mark_in
    s-o   set_mark_out

    v video {
        e encoder
        q quality
        f fps
        k keyframes
        p preset
        r resolution
        l lossless_cut
        a accurate_cut
    }
    a audio {
        e audio_encoder
        b audio_bitrate
        c combine_audio
        o combined_audio_only
    }
    T     tracks
    e     effects

    p     path
    _     space_replacement
    t     trash_source
    y     screenshot

    ENTER render
    r-q   render_queue
    r-p   render_pause
    d     trash_source_now

    s-s settings {
        s stats
        m menu_preset
        c config_manager
        l language
        v version
        U update
    }
    ESC   close
}

# Simple menu
menu simple {
    i      mark_in
    o      mark_out
    g      goto
    ctrl+i set_mark_in
    ctrl+o set_mark_out

    e      encoder
    q      quality
    F      fps
    k      keyframes
    P      preset
    ctrl+r resolution
    l      lossless_cut
    a      accurate_cut

    ctrl+a audio_encoder
    B      audio_bitrate
    c      combine_audio
    C      combined_audio_only
    T      tracks

    E      effects

    _      space_replacement
    p      path
    t      trash_source
    y      screenshot

    ENTER  render
    r      render_queue
    R      render_pause
    d      trash_source_now
    s      stats

    S settings {
        m menu_preset
        c config_manager
        l language
        v version
    }
    U      update
    ESC    close
}

# Example menu, uncomment it in your config to try it
# menu example {
#     # Use the Default menu as the base
#     base default
#
#     # Unbind d
#     d none
#
#     # Bind `R` to render
#     R render
#
#     # Also bind `x` to Mark In
#     add x mark_in
#
#     # Hide the item bound to `p` from the list, `p` keeps working
#     p hide
#
#     # Hide the Settings row, `s-s` still opens it and shows its items
#     s-s hide
#
#     # Patch the Video submenu, lines inside it patch its items
#     v video {
#         # Bind `Q` to Quality, it stays in the Video submenu
#         Q quality
#
#         # Unbind `a` inside the Video submenu only
#         a none
#     }
#
#     # Add a new submenu, `n` opens it
#     # Labeled by `submenu_extras` from the language file, or `Extras` when there's no such key
#     # A label after the id, e.g. `n extras My Extras {`, replaces the translation, `@key Fallback` keeps it translatable
#     n extras {
#         s stats
#     }
# }

## Configs

# Extra configs loaded in order from `~~/script-opts/tachytome/`, e.g. `work` for `work.conf`
# Later ones override earlier ones, `!name` keeps a disabled one in the list
# Lines above it apply before the configs, lines below override them
# Only works in user.conf, the Config Manager edits it
configs=
