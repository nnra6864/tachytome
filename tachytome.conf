## Output

# Dir renders go to, a typed path is relative to it, e.g. `Funny/clip`
# `./` starts from the source's dir instead, empty makes that the default
# See Path in the README for the other prefixes
output_dir=~/Videos/tachytome

# Added to the default output name so it doesn't overwrite the source
# Empty is fine when output_dir isn't the source's dir
suffix= Remuxed

# Replaces spaces in output names, ` ` keeps them, empty removes them
space_replacement=_

# Output container, mkv supports the most
# Typing an extension in the path picks it for that render, e.g. `clip.mp4`
# mka, opus, ogg, oga, m4a, mp3, aac, flac and wav are audio only
# opus, mp3, aac, flac and wav hold one track: the first mix, or the first kept track
# With no video kept, the default name uses the track's own format, or mka for several
container=mkv

# Moves the source to the trash after a render
trash_source=yes

## Video

# Video encoder, the nv_, amd_ and intel_ ones run on the GPU
# GPU encoders are much faster, software ones give smaller files at better quality
#   av1   smallest files and best quality, widely supported
#   h265  balances size, quality and speed
#   h264  for compatibility only, no proper 10 bit and far less efficient
video_encoder=av1

# Encoder quality, lower is better quality and a larger file
# Recommended and range:
#   av1         35  0-63
#   nv_av1      25  0-63
#   amd_av1     25  0-51
#   intel_av1   25  1-51
#   h265        20  0-51
#   nv_h265     20  0-51
#   amd_h265    20  0-51
#   intel_h265  20  1-51
#   h264        20  0-51
#   nv_h264     20  0-51
#   amd_h264    20  0-51
#   intel_h264  20  1-51
quality=35

# Compression effort, more effort gives a smaller file at the same quality
# Recommended, then the range from most to least effort:
#   av1         4         0 to 13
#   nv_av1      p7        p7 to p1
#   amd_av1     quality   quality, balanced, speed
#   intel_av1   veryslow  veryslow to veryfast
#   h265        slower    placebo to ultrafast
#   nv_h265     p7        p7 to p1
#   amd_h265    quality   quality, balanced, speed
#   intel_h265  veryslow  veryslow to veryfast
#   h264        slower    placebo to ultrafast
#   nv_h264     p7        p7 to p1
#   amd_h264    quality   quality, balanced, speed
#   intel_h264  veryslow  veryslow to veryfast
preset=4

# Max distance between keyframes, shorter seeks faster but makes larger files
# Frames, e.g. `120`, or seconds, e.g. `2s`, counted at the output FPS
# Empty matches the source, or the encoder's default when the source's is under a second
# Lossless Cut ignores it
keyframe_interval=

# Cuts without re-encoding, instant and untouched, but the files are larger
# Turns off Accurate Cut, Resolution and Effects, mixes still get encoded
lossless_cut=no

# Cuts at the exact frame instead of the nearest keyframe, keep it on
# Renders take longer to start when the mark in is far into a long video
# Turns off Lossless Cut
accurate_cut=yes

## Resolution

# Applies the resolution chain to renders, stays on across files
# Turns off Lossless Cut, and Lossless Cut turns it off
resolution_enabled=no

# Resolution chain, layers applied in order before the effects, empty keeps the source
#   0.5x, 50%  multiplier    1920x1080  box, filled by the mode
#   1280w      width         720h       height
#   720p       short side    4:3        aspect
#   auto       crops black bars, put it first, e.g. `auto 720p`
#   halfres    a preset from the .res files
# A mode or scaler right after a size or preset applies to it, e.g. `4:3 crop 0.5x`
# See Resolution in the README for the details
resolution=auto

# Mode for layers that don't set one, only boxes and aspects use it
#   fit      scales to fit inside, pads with pad_color
#   cover    scales to cover, crops the overflow from the center
#   stretch  scales to the exact size, ignoring the aspect
#   crop     cuts the center out without scaling
resolution_mode=fit

# Scaler for layers that shrink the frame and don't set one
# lanczos, spline, bicubic, area, bilinear, neighbor, fast_bilinear, bicublin, gauss, sinc
# lanczos is the sharpest, area is softer
scaler_down=lanczos

# Scaler for layers that grow the frame and don't set one, the same names as scaler_down
# neighbor keeps hard pixel edges, e.g. for pixel art
scaler_up=lanczos

# Color of the bars fit adds, any ffmpeg color, e.g. `black` or `0x202020`
pad_color=black

## Audio

# Audio encoder
#   copy  keeps the source audio, re-encoding with its codec only when needed,
#         e.g. for effects, mixes or a set bitrate
#   opus, aac, mp3, flac, vorbis, pcm  re-encode every kept track
# An audio only format that can't hold the codec uses its own, e.g. aac into `.opus`
audio_encoder=copy

# Audio bitrate, e.g. `128k`, setting it re-encodes every kept track
# Empty keeps the source's with the same codec, or uses the best quality:
# 256k per channel for opus and aac, 320k for mp3, quality 10 for vorbis
# flac and pcm ignore it, lossless sources aren't re-encoded just for it
audio_bitrate=

## Tracks

# Tracks chain every file starts with, layers applied in order, empty keeps every track
#   keep <list>                 keeps only these
#   drop <list>                 drops these
#   mix [list] ["name"] [at N]  adds a mix of the list, or of the kept tracks
#   rename <track> "name" ...   sets titles, e.g. `rename 1 "Game" 3 "Mic"`
#   move <track> at N ...       moves tracks, e.g. `move 3 at 1`
#   video <list>                the video tracks kept, `none` renders audio only
#   combined                    a preset from the .trk files
# Lists are track numbers or names, `all`, `none`, `@mixes` or `@sources`
# A `-` excludes, e.g. `all -2`, numbers count what the layers before left
# Examples:
#   mix keep @mixes      every track mixed into one
#   mix -2 "Voice" at 1  all but track 2 mixed into Voice, placed first
#   drop 3 video none    drops track 3 and the video
# See Tracks in the README for the details
tracks=

# Track type the Tracks list opens on, `audio` or `video`
tracks_type=audio

## Effects

# Applies the selected effects to renders, turns off Lossless Cut
effects_enabled=no

# Effects selected on start from the .eff files, e.g. `fade,blur_fade`
# `file/name` picks one from a specific file, e.g. `default/fade`
effects_presets=blur_fade

## Stats

# Shows the stats screen after a render
show_stats_screen=yes

# Prints the stats to the terminal after a render
show_stats_terminal=yes

# Seconds the stats screen stays up
stats_osd_time=8

## Text

# Font for all text, keep it monospace for the menu columns and the input cursor
# Empty picks Consolas on Windows, Menlo on macOS, monospace elsewhere
font=

# Font size
font_size=18

# Font size for smaller text, e.g. hints and descriptions
small_font_size=16

# Size of the glow around text
glow_size=2.5

# Blur of the text glow, from 0 for hard edges to 1 for fully blurred
glow_blur=0.5

# Color of the text glow, RRGGBB or RRGGBBAA
glow_color=000000FF

## Colors

# Color of the text
text_color=B8DEE6

# Color of dim text, e.g. hints, descriptions and current values
dim_text_color=8FADB3

# Color of values, e.g. 30
value_color=369DB2

# Text for on, next to toggles and selected list items
on_text=🞜

# Color of on
on_color=47B270

# Text for off
off_text=🞖

# Color of off
off_color=B24754

# Color of warnings
warning_color=8EB247

# Color of errors
error_color=B24754

# Color a triggered item flashes
flash_color=45CAE5

## Input Cursor

# Shape of the input cursor
#   bar        thin line before the character
#   underline  line under the character
#   block      fills the character, redrawn on top in cursor_text_color
cursor_style=bar

# Color of the input cursor, empty uses the value color
cursor_color=B8DEE6

# Size of the cursor glow, 0 turns it off
cursor_glow_size=1.5

# Blur of the cursor glow, from 0 for hard edges to 1 for fully blurred
cursor_glow_blur=0.5

# Color of the cursor glow
cursor_glow_color=000000FF

# Color of the character under the block cursor, empty inverts the cursor color
cursor_text_color=

## Animations

# Seconds a triggered item takes to flash
flash_in_duration=0.1

# Easing of the flash, a name from https://easings.net in snake_case,
# e.g. `ease_out_expo`, or a cubic bezier, e.g. `bezier(0.22, 1, 0.36, 1)`
flash_in_easing=ease_out_expo

# Seconds a triggered item takes to fade back
flash_out_duration=0.5

# Easing of the fade back, like flash_in_easing
flash_out_easing=ease_out_cubic

# Seconds between items starting to flash when the menu opens
start_stagger=0.03

# Seconds of the flash when the menu opens, -1 uses flash_in_duration
start_in_duration=0.25

# Easing of the flash when the menu opens, empty uses flash_in_easing
start_in_easing=ease_out_sine

# Seconds of the fade back when the menu opens, -1 uses flash_out_duration
start_out_duration=0.75

# Easing of the fade back when the menu opens, empty uses flash_out_easing
start_out_easing=ease_out_cubic

## Menu

# Menu to use, `default` or one defined below or in a config
selected_menu=default

# Separator between submenus in the menu title, e.g. `< Tachytome / Settings >`
menu_path_separator=/

# Previews the hovered layer in the Resolution and Tracks lists
#   yes  the title shows the result after the hovered layer
#   no   every layer shows its own result, e.g. `1920x1080 -> 960x540`
layer_preview=yes

## Language and Version

# UI language, a file from the lang dir without .lua, e.g. `en` or `sr`
# `auto` detects the system language on every start
# Languages and translations that are missing fall back to English
language=auto

# Version Update installs
#   latest  the release marked Latest, or the highest version tag
#   master  a branch name follows that branch
#   2.1     the newest matching version, e.g. `3` for 3.x.x, `1.2.5` for exactly that
# A git clone uses its remote, otherwise the GitHub repo
version=latest

## Menus

# Rebind on top of the active menu
# menu R render
# menu add x mark_in
# menu q-c quality
# menu hide X render_queue
# menu s-s hide

# Default menu
menu default {
    g     goto
    i     mark_in
    o     mark_out
    s-i   set_mark_in
    s-o   set_mark_out

    v video {
        e encoder
        q quality
        f fps
        k keyframes
        p preset
        r resolution
        l lossless_cut
        a accurate_cut
    }
    a audio {
        e audio_encoder
        b audio_bitrate
        c combine_audio
        o combined_audio_only
    }
    T     tracks
    e     effects

    p     path
    _     space_replacement
    t     trash_source

    ENTER render
    r-q   render_queue
    r-p   render_pause
    d     trash_source_now

    s-s settings {
        s stats
        m menu_preset
        c settings_manager
        l language
        v version
        U update
    }
    ESC   close
}

# Simple menu
menu simple {
    i      mark_in
    o      mark_out
    g      goto
    ctrl+i set_mark_in
    ctrl+o set_mark_out

    e      encoder
    q      quality
    F      fps
    k      keyframes
    P      preset
    ctrl+r resolution
    l      lossless_cut
    a      accurate_cut

    ctrl+a audio_encoder
    B      audio_bitrate
    c      combine_audio
    C      combined_audio_only
    T      tracks

    E      effects

    _      space_replacement
    p      path
    t      trash_source

    ENTER  render
    r      render_queue
    R      render_pause
    d      trash_source_now
    s      stats

    S settings {
        m menu_preset
        c settings_manager
        l language
        v version
    }
    U      update
    ESC    close
}

# Example menu, uncomment it in your config to try it
# menu example {
#     # Use the Default menu as the base
#     base default
#
#     # Unbind d
#     d none
#
#     # Bind `R` to render
#     R render
#
#     # Also bind `x` to Mark In
#     add x mark_in
#
#     # Hide the item bound to `p` from the list, `p` keeps working
#     p hide
#
#     # Hide the Settings row, `s-s` still opens it and shows its items
#     s-s hide
#
#     # Patch the Video submenu, lines inside it patch its items
#     v video {
#         # Bind `Q` to Quality, it stays in the Video submenu
#         Q quality
#
#         # Unbind `a` inside the Video submenu only
#         a none
#     }
#
#     # Add a new submenu, `n` opens it
#     # Labeled by `submenu_extras` from the language file, or `Extras` when there's no such key
#     # A label after the id, e.g. `n extras My Extras {`, replaces the translation, `@key Fallback` keeps it translatable
#     n extras {
#         s stats
#     }
# }

## Configs

# Extra configs loaded in order, named without .conf, e.g. `work` for work.conf
# Later ones override earlier ones, `!name` keeps a disabled one in the list
# Lines above this one apply before the configs, lines below override them
# Configs can set options and menus, unlisted .conf files show up disabled
# Only works in user.conf, default.conf and user.conf are always loaded
# The Settings Manager edits this list, Enter there opens the Settings Editor
configs=
