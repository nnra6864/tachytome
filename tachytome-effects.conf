# Effect presets for Tachytome
# This file is read from `~~/script-opts/tachytome-effects.conf`
# Preset names are unique, the last definition wins
#
# Block syntax:
#   effect <name>
#       label <text>                     display name, defaults to <name>
#       anchor <start|end>               where the atoms below it apply, defaults to start
#                                        may be repeated to animate both ends in one effect
#       duration <seconds>               fade/ramp length, prompted in the menu
#       param <key> <default>            custom value, prompted in the menu
#                                        numeric when the default is a number, string otherwise
#       fade [easing]                    video + audio fade
#       vfade [easing]                   video fade only
#       afade [easing]                   audio fade only
#       ramp <from> <to> [angle] [easing]
#                                        directional blur animated from <from> to <to>
#                                        angle 0 = x axis, 90 = y axis, anything else is diagonal
#       blur <amount> [angle]            static directional blur, limited to the duration if set
#       tmix <frames>                    motion blur
#       vanimate <filter> <option> <from> <to> [easing]
#       aanimate <filter> <option> <from> <to> [easing]
#                                        animate an option of any video/audio filter that accepts commands
#                                        name the filter to target it, e.g. `gblur@soft`
#       video <ffmpeg video filter>      raw filter, may be repeated
#       audio <ffmpeg audio filter>      raw filter, may be repeated
#   end
#
# Easings match https://easings.net in snake_case, e.g. `ease_out_expo`
# Custom cubic bezier curves: `bezier(0.22, 1, 0.36, 1)`
# Omitted on a video fade or an animation is linear, omitted on an audio fade keeps the native ffmpeg fade
# Timed atoms default to a duration of 1 second
# {var} expands to `param` keys, `d`, `st`, `duration` inside values
# A param whose default is an easing is validated as one in the menu

# Fades video and audio in and out
effect fade
    label Fade
    duration 1
    param curve ease_out_expo

    anchor start
    fade {curve}

    anchor end
    fade {curve}
end

# Same as fade, with x blur going from 200 to 0 and from 0 to 200
effect blur_fade
    label Blur Fade
    duration 1
    param blur 200
    param curve ease_out_expo

    anchor start
    ramp {blur} 0 0 {curve}
    fade {curve}

    anchor end
    ramp 0 {blur} 0 {curve}
    fade {curve}
end

