# Track presets that come with Tachytome, read from here as `default`, updates replace this file
# Your own go in `.trk` files in `~~/script-opts/tachytome/`, e.g. `user.trk`, read after this one alphabetically
# Preset names are unique per file, the last definition in a file wins with a warning
# Different files can use the same names, e.g. `default/combined` and `mine/combined`
# A bare name picks the last file that defines it, so yours win, `file/name` picks one from a specific file
#
# Syntax:
#   <name> = <chain>
#   disabled <name> = <chain>
#   default/<name> = on|off
#
# `disabled` turns a preset off, remove it to turn the preset back on
# A disabled preset isn't listed and a bare name skips it for the previous file that defines it
# `default/<name> = on` or `off` in your files turns one of the presets below on or off
# `m` in the Tracks Presets list opens the Preset Manager, which enables, disables and deletes presets for you
# The `#` lines right above a preset, or above its group, up to a blank line, are its description, shown when it's hovered
# `n` in the Tracks List or its Presets list saves the chain you have now as a preset, in `user.trk`, another file or a new one
#
# A chain is anything the `tracks` option takes, audio layers and `video` together, other presets included
# Names are case insensitive and can't hold spaces, `=`, `/`, `"`, `,` or `#`
# Names can't be op words, `all`, `none`, `at` or numbers, or start with `-` or `@`
# Presets are used by name anywhere a layer can start in a chain, e.g. `combined` or `drop 2 combined_only`
# A track named like a preset needs quotes in lists, e.g. `keep "combined"`
# A preset's `video` applies unless a `video` after it in the chain replaces it

# Adds a mix of every track named Combined, first, like Combine Audio
# [sr]
# Dodaje miks svih traka nazvan Combined, na prvo mesto, kao Spoji audio
combined = mix "Combined" at 1

# Keeps just the mix of every track named Combined, like Combine Audio with Combined Only
# [sr]
# Zadržava samo miks svih traka nazvan Combined, kao Spoji audio sa Samo spojeni
combined_only = mix "Combined" keep @mixes

# Examples, turn on the ones you want with Tab in the Preset Manager

# Desktop, Discord and Mic recorded apart, the voices mixed into one track placed first
# [sr]
# Desktop, Discord i mikrofon snimljeni odvojeno, glasovi spojeni u jednu traku na prvom mestu
disabled voice_mix = mix 2,3 "Voices" at 1

# Just the audio, no video
# [sr]
# Samo zvuk, bez videa
disabled audio_only = video none
